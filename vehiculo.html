<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vehículo | PITLANE Automotores</title>
  <meta name="description" content="Ficha de vehículo de PITLANE Automotores, Yerba Buena, Tucumán." />
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;color:#111;background:#f4f4f2}a{color:inherit;text-decoration:none}.top{height:30px;background:#0b0b0b;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;font-size:10px;letter-spacing:.12em;text-transform:uppercase}.nav{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;background:#0a0a0a;color:#fff}.brand{height:68px;display:flex;align-items:center}.pitlane-logo{display:block;width:205px;height:auto}.back{border:1px solid #444;border-radius:999px;padding:11px 16px;font-size:12px;font-weight:700}.detail{max-width:1240px;margin:0 auto;padding:56px 0 90px}.breadcrumb{display:inline-block;color:#666;font-size:13px;margin-bottom:24px}.sheet{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(340px,.75fr);background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.08)}.photo{min-height:620px;background:#ddd}.photo img{display:block;width:100%;height:100%;min-height:620px;object-fit:cover}.info{padding:54px 46px;display:flex;flex-direction:column}.code{font-size:11px;font-weight:800;letter-spacing:.16em;color:#777}.brand-name{color:#666;margin:36px 0 4px}.info h1{font-size:52px;letter-spacing:-.055em;font-weight:400;line-height:1;margin:0}.version{font-size:20px;color:#555;margin:13px 0 34px}.facts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #ddd}.fact{padding:20px 0;border-bottom:1px solid #ddd}.fact:nth-child(even){padding-left:20px;border-left:1px solid #ddd}.fact span{display:block;color:#777;font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}.fact strong{font-size:17px}.price{margin:34px 0 22px}.price span{display:block;color:#777;font-size:12px;margin-bottom:5px}.price strong{font-size:30px}.wa{display:block;background:#111;color:#fff;border-radius:12px;padding:16px 20px;font-weight:800;text-align:center;margin-top:auto}.note{font-size:12px;color:#777;line-height:1.5;margin:14px 0 0}.not-found{background:#fff;border-radius:20px;padding:60px;text-align:center}.not-found h1{font-size:42px;font-weight:400}.footer{background:#0b0b0b;color:#999;padding:28px 5vw;display:flex;justify-content:space-between;font-size:12px}@media(max-width:1300px){.detail{margin-left:5vw;margin-right:5vw}}@media(max-width:820px){.sheet{grid-template-columns:1fr}.photo,.photo img{min-height:0;height:52vw}.info{padding:36px 28px}.info h1{font-size:42px}}@media(max-width:520px){.top span:last-child{display:none}.nav{height:70px}.pitlane-logo{width:170px}.back{padding:9px 12px}.detail{margin:0;padding:20px 18px 60px}.breadcrumb{margin-bottom:18px}.sheet{border-radius:16px}.photo,.photo img{height:68vw}.info{padding:30px 22px}.brand-name{margin-top:26px}.info h1{font-size:38px}.footer{flex-direction:column;gap:8px}}
  </style>
</head>
<body>
  <div class="top"><span>Yerba Buena · Tucumán</span></div>
  <nav class="nav">
    <a class="brand" href="index.html" aria-label="Pitlane Automotores, volver al inicio"><svg class="pitlane-logo" viewBox="0 0 520 92" role="img" aria-label="Pitlane Automotores"><g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12 V54 M10 12 H54 Q68 12 68 25 Q68 38 54 38 H10"/><path d="M96 12 V54"/><path d="M125 12 H177 M151 12 V54"/><path d="M205 12 V54 H246"/><path d="M275 54 L302 12 L329 54"/><path d="M358 54 V12 L402 54 V12"/><path d="M438 12 V54 M438 12 H490 M438 33 H482 M438 54 H490"/></g><g fill="currentColor"><rect x="10" y="77" width="64" height="2" rx="1"/><rect x="446" y="77" width="64" height="2" rx="1"/><text x="260" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" letter-spacing="8">AUTOMOTORES</text></g></svg></a>
    <a class="back" href="index.html#stock">← Volver a vehículos</a>
  </nav>
  <main class="detail" id="detail" aria-live="polite"></main>
  <footer class="footer"><span>© 2026 PITLANE Automotores</span></footer>
  <script src="public/vehicles.js"></script>
  <script>
    const WHATSAPP='5493816158785';
    const id=new URLSearchParams(window.location.search).get('id');
    const vehicle=window.PITLANE_VEHICLES.find(item=>item.id===id);
    const detail=document.getElementById('detail');
    if(!vehicle){
      document.title='Vehículo no encontrado | PITLANE Automotores';
      detail.innerHTML='<section class="not-found"><h1>No encontramos ese vehículo</h1><p>La ficha solicitada no está disponible.</p><a class="wa" href="index.html#stock">Ver vehículos</a></section>';
    }else{
      const name=`${vehicle.brand} ${vehicle.model}`;
      const message=`Hola PITLANE. Me interesa el ${name} ${vehicle.version} ${vehicle.year} (${vehicle.id}).`;
      document.title=`${name} | PITLANE Automotores`;
      detail.innerHTML=`<a class="breadcrumb" href="index.html#stock">← Vehículos disponibles</a><article class="sheet"><div class="photo"><img src="${vehicle.image}" alt="${name}"></div><div class="info"><span class="code">${vehicle.id}</span><p class="brand-name">${vehicle.brand}</p><h1>${vehicle.model}</h1><p class="version">${vehicle.version}</p><div class="facts"><div class="fact"><span>Año</span><strong>${vehicle.year}</strong></div><div class="fact"><span>Kilometraje</span><strong>${vehicle.km}</strong></div><div class="fact"><span>Categoría</span><strong>${vehicle.category}</strong></div></div><div class="price"><span>Precio</span><strong>${vehicle.price}</strong></div><a class="wa" target="_blank" rel="noopener" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent(message)}">Consultar por WhatsApp →</a><p class="note">Consultanos para recibir información y coordinar una visita.</p></div></article>`;
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vehículo | PITLANE Automotores</title>
  <meta name="description" content="Ficha de vehículo de PITLANE Automotores, Yerba Buena, Tucumán." />
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;color:#111;background:#f4f4f2}a{color:inherit;text-decoration:none}
    .top{height:30px;background:#0b0b0b;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
    .nav{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;background:#0a0a0a;color:#fff;position:sticky;top:0;z-index:20}
    .brand{height:68px;display:flex;align-items:center}.pitlane-logo{display:block;width:205px;height:auto}
    .back{border:1px solid #444;border-radius:999px;padding:11px 16px;font-size:12px;font-weight:700}
    .detail{max-width:1320px;margin:0 auto;padding:34px 0 90px}
    .breadcrumb{display:inline-block;color:#666;font-size:13px;margin:0 0 22px}
    .detail-layout{display:grid;grid-template-columns:minmax(320px,.72fr) minmax(0,1.28fr);gap:22px;align-items:start}
    .info-panel{position:sticky;top:100px;background:#fff;border:1px solid #e5e5e2;padding:34px 32px;border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.055)}
    .code{font-size:10px;font-weight:800;letter-spacing:.16em;color:#888}
    .brand-name{color:#777;margin:25px 0 5px;font-size:13px}
    .info-panel h1{font-size:clamp(34px,4vw,54px);letter-spacing:-.06em;font-weight:500;line-height:.98;margin:0}
    .version{font-size:17px;color:#555;margin:12px 0 26px}
    .facts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #e6e6e3}
    .fact{padding:16px 8px 16px 0;border-bottom:1px solid #e6e6e3}
    .fact:nth-child(even){padding-left:15px;border-left:1px solid #e6e6e3}
    .fact span{display:block;color:#888;font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
    .fact strong{font-size:14px;font-weight:650}
    .price{margin:23px 0 18px}.price span{display:block;color:#888;font-size:11px;margin-bottom:4px}.price strong{font-size:26px}
    .wa{display:block;background:#111;color:#fff;border-radius:10px;padding:15px 18px;font-weight:800;text-align:center}
    .note{font-size:11px;color:#888;line-height:1.55;margin:12px 0 0}
    .gallery-column{min-width:0}
    .gallery-heading{display:flex;justify-content:space-between;align-items:end;margin:0 0 13px;gap:20px}
    .gallery-heading h2{font-size:22px;font-weight:550;letter-spacing:-.04em;margin:0}
    .gallery-heading span{font-size:11px;color:#888}
    .photo-card{margin:0 0 16px;background:#fff;border:1px solid #e5e5e2;border-radius:14px;overflow:hidden}
    .photo-card img{display:block;width:100%;max-height:570px;aspect-ratio:16/10;object-fit:cover;background:#e8e8e6}
    .photo-copy{padding:17px 20px 19px}.photo-copy h3{font-size:16px;margin:0 0 6px;font-weight:650}.photo-copy p{font-size:13px;color:#666;line-height:1.65;margin:0}
    .description-card{background:#fff;border:1px solid #e5e5e2;border-radius:14px;padding:25px 24px;margin-top:18px}
    .eyebrow{font-size:10px;letter-spacing:.16em;color:#888;font-weight:800;text-transform:uppercase}
    .description-card h2{font-size:24px;letter-spacing:-.045em;font-weight:550;margin:8px 0 12px}
    .description-card p{color:#666;font-size:14px;line-height:1.75;margin:0}
    .highlights{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:19px 0 0;padding:0;list-style:none}
    .highlights li{background:#f4f4f2;border-radius:8px;padding:12px 13px;font-size:12px;color:#444;line-height:1.5}
    .not-found{background:#fff;border-radius:20px;padding:60px;text-align:center}.not-found h1{font-size:42px;font-weight:400}
    .footer{background:#0b0b0b;color:#999;padding:28px 5vw;display:flex;justify-content:space-between;font-size:12px}
    @media(max-width:1000px){.detail{margin:0 5vw}.detail-layout{grid-template-columns:minmax(280px,.8fr) minmax(0,1.2fr)}.info-panel{padding:26px 23px}}
    @media(max-width:760px){.nav{height:70px}.pitlane-logo{width:170px}.detail{margin:0;padding:22px 18px 60px}.detail-layout{grid-template-columns:1fr;gap:16px}.info-panel{position:relative;top:auto;padding:27px 22px}.brand-name{margin-top:19px}.gallery-heading{margin-top:5px}.photo-card img{aspect-ratio:4/3;max-height:420px}.highlights{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.top span:last-child{display:none}.back{padding:9px 12px;font-size:11px}.info-panel h1{font-size:40px}.facts .fact strong{font-size:13px}.photo-copy{padding:15px}.description-card{padding:21px 18px}.highlights{grid-template-columns:1fr}.footer{flex-direction:column;gap:8px}}
  </style>
</head>
<body>
  <div class="top"><span>Yerba Buena · Tucumán</span></div>
  <nav class="nav">
    <a class="brand" href="index.html" aria-label="Pitlane Automotores, volver al inicio"><svg class="pitlane-logo" viewBox="0 0 520 92" role="img" aria-label="Pitlane Automotores"><g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12 V54 M10 12 H54 Q68 12 68 25 Q68 38 54 38 H10"/><path d="M96 12 V54"/><path d="M125 12 H177 M151 12 V54"/><path d="M205 12 V54 H246"/><path d="M275 54 L302 12 L329 54"/><path d="M358 54 V12 L402 54 V12"/><path d="M438 12 V54 M438 12 H490 M438 33 H482 M438 54 H490"/></g><g fill="currentColor"><rect x="10" y="77" width="64" height="2" rx="1"/><rect x="446" y="77" width="64" height="2" rx="1"/><text x="260" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" letter-spacing="8">AUTOMOTORES</text></g></svg></a>
    <a class="back" href="index.html#stock">← Volver a vehículos</a>
  </nav>
  <main class="detail" id="detail" aria-live="polite"></main>
  <footer class="footer"><span>© 2026 PITLANE Automotores</span></footer>
  <script src="public/vehicles.js"></script>
  <script>
    const WHATSAPP='5493816158785';
    const id=new URLSearchParams(window.location.search).get('id');
    const vehicle=window.PITLANE_VEHICLES.find(item=>item.id===id);
    const detail=document.getElementById('detail');
    const safe=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    if(!vehicle){
      document.title='Vehículo no encontrado | PITLANE Automotores';
      detail.innerHTML='<section class="not-found"><h1>No encontramos ese vehículo</h1><p>La ficha solicitada no está disponible.</p><a class="wa" href="index.html#stock">Ver catálogo</a></section>';
    }else{
      const name=`${vehicle.brand} ${vehicle.model}`;
      const message=`Hola PITLANE. Quiero consultar por el modelo de referencia ${name} ${vehicle.version} ${vehicle.year}.`;
      document.title=`${name} ${vehicle.year} | PITLANE Automotores`;
      const photos=(vehicle.photos||[{src:vehicle.image,alt:name,title:'Galería',description:vehicle.description}]).map(photo=>`<figure class="photo-card"><img src="${safe(photo.src)}" alt="${safe(photo.alt||name)}" loading="lazy"><figcaption class="photo-copy"><h3>${safe(photo.title||'Detalles del vehículo')}</h3><p>${safe(photo.description||'')}</p></figcaption></figure>`).join('');
      const facts=[['Año',vehicle.year],['Kilometraje',vehicle.km],['Categoría',vehicle.category],['Motor',vehicle.engine],['Transmisión',vehicle.transmission],['Combustible',vehicle.fuel]];
      detail.innerHTML=`<a class="breadcrumb" href="index.html#stock">← Volver al catálogo</a><div class="detail-layout">
        <aside class="info-panel"><span class="code">MODELO DE REFERENCIA · ${safe(vehicle.id)}</span><p class="brand-name">${safe(vehicle.brand)}</p><h1>${safe(vehicle.model)}</h1><p class="version">${safe(vehicle.version)}</p>
          <div class="facts">${facts.map(([label,value])=>`<div class="fact"><span>${safe(label)}</span><strong>${safe(value||'Consultar')}</strong></div>`).join('')}</div>
          <div class="price"><span>Precio / disponibilidad</span><strong>Consultar</strong></div>
          <a class="wa" target="_blank" rel="noopener" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent(message)}">Consultar este modelo →</a>
          <p class="note">Modelo de referencia para mostrar la categoría. La unidad, versión, kilometraje, equipamiento y disponibilidad se confirman al momento de la consulta.</p>
        </aside>
        <section class="gallery-column"><div class="gallery-heading"><h2>Fotos y detalles</h2><span>${(vehicle.photos||[]).length} imágenes de referencia</span></div>
          ${photos}
          <article class="description-card"><span class="eyebrow">PITLANE · DESCRIPCIÓN</span><h2>Sobre este modelo</h2><p>${safe(vehicle.description)}</p><ul class="highlights">${(vehicle.highlights||[]).map(item=>`<li>${safe(item)}</li>`).join('')}</ul></article>
        </section>
      </div>`;
    }
  </script></body>
</html>
